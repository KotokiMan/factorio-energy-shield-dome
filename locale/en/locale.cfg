field-enabled-tooltip=Zap enemies within 6 tiles outside the dome edge. Turn off to keep all energy for the barrier.
field-reserve=Field reserve
field-reserve-tooltip=The electric field only spends energy above this share of the buffer; the rest is kept for the barrier. 0% = the field may drain the buffer, 95% = it fires only while the dome is almost fully charged.
