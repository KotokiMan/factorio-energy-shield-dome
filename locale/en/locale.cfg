[entity-name]
energy-shield-generator=Shield dome generator

[entity-description]
energy-shield-generator=Grows a dome barrier from the generator up to the set radius. Growing, holding and absorbing hits draw power from the internal buffer. If the buffer runs dry, the dome collapses.

[item-name]
energy-shield-generator=Shield dome generator

[technology-name]
energy-shield-dome=Shield dome
esd-radius=Shield dome radius

[technology-description]
energy-shield-dome=A dome barrier that stops enemies and absorbs damage at the cost of power. The emitter core can only be assembled in Fulgora's magnetic field, which also keeps the dome from forming there.
esd-radius=Increases the maximum dome radius.

[esd-tech]
radius-effect=Maximum dome radius: +__1__

