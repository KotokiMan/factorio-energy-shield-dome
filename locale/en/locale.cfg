[mod-setting-name]
esd-max-generators=Maximum generators per dome
esd-max-radius-cap=Maximum dome radius cap
esd-dome-glow=Dome edge glow
esd-alerts=Shield dome alerts

[mod-setting-description]
esd-max-generators=How many generators (including the central one) can power one dome. Each adds energy; the maximum radius grows with the square root of their number. Extra generators inside a dome stay idle.
esd-max-radius-cap=Hard limit on dome radius regardless of research and quality. 0 = no limit.
esd-dome-glow=Soft glow along the dome edge. The thin outline is always shown.
esd-alerts=Alerts when a dome is under attack or collapses.

[esd-alert]
under-attack=Shield dome under attack
collapsed=Shield dome collapsed

