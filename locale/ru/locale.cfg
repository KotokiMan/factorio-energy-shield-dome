[entity-name]
energy-shield-generator=Генератор купола-щита

[entity-description]
energy-shield-generator=Разворачивает купол-барьер от генератора до заданного радиуса. Расширение, поддержание и поглощение ударов расходуют энергию из внутреннего буфера. Если буфер иссякнет, купол схлопнется.

[item-name]
energy-shield-generator=Генератор купола-щита

[technology-name]
energy-shield-dome=Купол-щит
esd-radius=Радиус купола-щита

[technology-description]
energy-shield-dome=Купол-барьер, который останавливает врагов и поглощает урон ценой энергии. Ядро излучателя можно собрать только в магнитном поле Фульгоры, и то же поле не даёт куполу сформироваться там.
esd-radius=Увеличивает максимальный радиус купола.

[esd-tech]
radius-effect=Максимальный радиус купола: +__1__

[esd-gui]
title=Купол-щит
buffer=Буфер: __1__ / __2__
upkeep=Поддержание: __1__
radius=Радиус: __1__ / __2__
target-radius=Радиус
field-enabled=Электрическое поле
field-enabled-tooltip=Бить врагов разрядами в 6 клетках за краем купола. Выключите, чтобы вся энергия шла только на защиту.
field-reserve=Резерв от поля
field-reserve-tooltip=Электрическое поле тратит только энергию выше этой доли буфера, остальное бережётся на защиту. 0% — поле может опустошить буфер, 95% — бьёт, только пока купол почти полностью заряжен.
turn-on=Включить
role-primary=Центр купола · генераторов: __1__ / __2__
role-support=Поддерживает купол · генераторов: __1__ / __2__
role-idle=Простаивает: в куполе уже максимум генераторов (__1__)
turn-off=Выключить

[esd-state]
charging=Зарядка
expanding=Расширение
stable=Стабилен
cooldown=Пробит, перезарядка
off=Выключен
disabled=Недоступен
paused=(ждёт энергию)
seconds=(__1__ с)
idle=Лишний: в куполе уже максимум генераторов

[esd-reason]
fulgora=Магнитное поле слишком плотное — купол не может стабилизироваться.
not-calibrated=Излучатель не откалиброван для этой планеты.
space=Не работает в космосе.
blocked=Расширение остановлено вражеской постройкой.

[mod-setting-name]
esd-max-generators=Максимум станций в куполе
esd-max-radius-cap=Потолок радиуса купола
esd-dome-glow=Свечение края купола
esd-alerts=Оповещения купола-щита

[mod-setting-description]
esd-max-generators=Сколько генераторов (вместе с центральным) может держать один купол. Каждый добавляет энергию, а максимальный радиус растёт как корень из их числа. Лишние генераторы в куполе стоят без дела.
esd-max-radius-cap=Жёсткий предел радиуса купола независимо от исследований и качества. 0 — без ограничения.
esd-dome-glow=Мягкое свечение вдоль края купола. Тонкий контур виден всегда.
esd-alerts=Оповещения, когда купол атакуют или он пробит.

[esd-alert]
under-attack=Купол-щит атакован
collapsed=Купол-щит пробит

[shortcut-name]
esd-toggle-map=Купола-щиты на карте

[controls]
esd-toggle-map-input=Показать купола-щиты на карте

